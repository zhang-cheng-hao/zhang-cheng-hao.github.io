short_bio_text_justify: false
short_bio: >-
  <p>
    I am a master's student in Software Engineering at Tsinghua University,
    expected to graduate in 2027. I also received my B.Eng. in Software
    Engineering from Tsinghua University.
  </p>
  <p>
    My research and engineering work focuses on <strong>LLM post-training and
    retrieval augmentation</strong>, including Agentic RAG, SFT/GRPO, model
    evaluation and error analysis, and distributed training-system
    optimization.
  </p>
  <p class="mb-0">
    During internships at Alibaba Qwen and Kuaishou, I worked on long-horizon
    Agentic RAG, LLM post-training, multimodal recommendation representations,
    and generative recommendation, with an emphasis on building accurate,
    reliable, and efficient LLM systems.
  </p>

short_bio_zh: >-
  <p>
    我是清华大学软件学院软件工程硕士研究生，预计 2027 年毕业，本科同样就读于清华大学软件学院。
  </p>
  <p>
    我的研究与工程实践聚焦<strong>大模型后训练与检索增强</strong>，主要包括 Agentic RAG、SFT/GRPO、
    大模型评测与误差分析，以及分布式训练系统优化。
  </p>
  <p class="mb-0">
    曾在阿里巴巴千问事业部和快手基础大模型与应用部实习，开展长耗时 Agentic RAG、大模型后训练、
    多模态推荐表征与生成式推荐相关工作，关注大模型系统的准确性、可靠性与运行效率。
  </p>

